# =====================================================================
# 实验室局域网部署 — Nginx 反向代理配置（HTTP，无 TLS）
# 适用场景：参与者都在同一局域网，用 http://<服务器内网IP> 访问。
# 优点：无需域名/证书，几分钟配好；缺点：明文传输、范围受限。
#
# 使用前替换：
#   - server_name  改成服务器内网 IP（如 192.168.1.100）或留 _ 由 IP 访问
#   - /path/to    改成实际绝对路径（后端项目根、前端 dist 目录）
#   - 后端 uvicorn 仍绑 127.0.0.1:8000（不暴露到公网），由本 nginx 在本地转发
# =====================================================================

server {
    listen 80;
    server_name 192.168.1.100;   # ← 改成你的服务器内网 IP（或 _ 用 IP 直接访问）

    # —— 前端静态资源（npm run build 产物）——
    root /path/to/travel-experiment-platform/frontend/dist;
    index index.html;

    # SPA 路由：刷新子路由时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 后端 API 反向代理 ——
    # 前端写死的 '/api' 与 CORS 问题，同域下天然解决（浏览器不会触发跨域预检）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（智囊团讨论 / 单助理对话）必须关闭缓冲，否则前端收不到流式推送
        proxy_buffering off;
        proxy_cache off;
        # 超时设长：MOA 群辩在 LLM 调用间隙 SSE 流会空闲数秒（专家并发轮、等待用户回填），
        # 若此处超时过短（如默认 60s）会在空闲间隙断流，前端讨论中断。3600s 足够。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 大文件下载（导出的 Word / 文档）可放宽超时
    location /api/document/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
