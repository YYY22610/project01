# =====================================================================
# 公网部署 — Nginx 反向代理配置（HTTPS，Let's Encrypt 证书）
# 适用场景：参与者分布在不同网络，用 https://你的域名 访问。
# 必备前置：已备案域名 + 公网服务器 + 真实 SMTP（提醒邮件要用）。
#
# 证书获取（免费）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# 执行后会自动把 80 端口重定向到 443 并补上 ssl_certificate 等指令；
# 下方 ssl_certificate / ssl_certificate_key 路径为 certbot 默认产物。
# =====================================================================

server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名
    # 80 端口仅用于 certbot 申请/续期校验，正式访问一律跳 443
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;   # ← 改成你的域名

    # —— Let's Encrypt 证书（certbot 自动生成/续期）——
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全：HSTS（公网必开）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # —— 前端静态资源 ——
    root /path/to/travel-experiment-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 后端 API ——
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        # 超时设长：MOA 群辩在 LLM 调用间隙 SSE 流会空闲数秒（专家并发轮、等待用户回填），
        # 若此处超时过短（如默认 60s）会在空闲间隙断流，前端讨论中断。3600s 足够。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/document/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
