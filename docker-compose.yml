version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_experiment_db
    environment:
      POSTGRES_DB: travel_experiment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_experiment_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/travel_experiment
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_experiment_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["full"]

volumes:
  pgdata:
